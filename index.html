/* ---- 日付ユーティリティ ---- */
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseIso = (s) => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const sameYM = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth();

/* ブックマーク/申請したとき、開催頻度から「次のそれっぽい日」を割り当てる。
   実データの日付がないので、デモとして現実的な近い将来の日付を生成する。
   weekly=次の土曜, monthly=来月の第3土曜あたり, varies=10日後 */
function nextDateFor(recurring) {
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (recurring === "weekly") {
    const day = d.getDay();
    const add = ((6 - day) + 7) % 7 || 7;   // 次の土曜(今日が土曜なら来週)
    d.setDate(d.getDate() + add);
  } else if (recurring === "monthly") {
    d.setDate(d.getDate() + 18);            // だいたい2〜3週間後
  } else {
    d.setDate(d.getDate() + 10);            // varies: 10日後
  }
  return iso(d);
}

function Chip({ label, active, onClick }) {
  return (
    <button onClick={onClick} style={{
      padding:"7px 14px", borderRadius:999, fontSize:12.5, fontWeight:700, cursor:"pointer",
      border:`2px solid ${active ? C.sky : C.line}`,
      background: active ? C.sky : C.white, color: active ? C.white : C.ink,
      transition:"all 0.15s", fontFamily:"Poppins,sans-serif", whiteSpace:"nowrap",
    }}>{label}</button>
  );
}

          <div style={{ display:"flex", gap:4, flexShrink:0 }}>
            {applied && <span style={{ fontSize:11, fontWeight:800, color:C.leaf }}>✓</span>}
            {bookmarked && <span style={{ fontSize:14 }}>🔖</span>}
          </div>
        </div>
        {item.org && <div style={{ fontSize:11, color:C.fade, marginTop:3, fontWeight:600, fontFamily:"Poppins,sans-serif" }}>{item.org}</div>}
        <div style={{ display:"flex", gap:12, marginTop:8, fontSize:11, color:C.fade, flexWrap:"wrap", fontFamily:"Poppins,sans-serif" }}>
          <span>⏱ {item.dur}{t.hours}</span>
          <span>📍 {t.areas[item.area]}</span>
          <span style={{ fontWeight:800, color:C.leaf }}>💵 {t.free}</span>
          {item.recurring && <span>🔁 {t.every[item.recurring]}</span>}
        </div>
      </div>
    </button>
  );
}

/* ---- 本体 ---- */
function App() {
  const [lang, setLang] = useState("en");
  const [tab, setTab] = useState("public");
  const [openId, setOpenId] = useState(null);      // ボランティアページで開いている活動
  const [query, setQuery] = useState("");
  const [showFilters, setShowFilters] = useState(false);
  const [fArea, setFArea] = useState([]);
  const [fContent, setFContent] = useState([]);
  const [fEffort, setFEffort] = useState([]);
  const [fTime, setFTime] = useState("full");

  // ブックマーク: { [itemId]: ["me"] または ["g1","g2"] }
  const [bookmarks, setBookmarks] = useState({});
  // 申請済み: Set的に { [itemId]: true }
  const [applied, setApplied] = useState({});
  // モーダル
  const [bmSheetFor, setBmSheetFor] = useState(null);   // ブックマーク選択中の活動id
  const [bmDraft, setBmDraft] = useState([]);           // 選択途中の状態
  const [applyConfirmFor, setApplyConfirmFor] = useState(null); // 申請確認中の活動id
  const [toast, setToast] = useState("");

  // カレンダー: 活動id → 割り当て日(ISO)。ブックマーク/申請時に埋まる。
  // 友達(ダミー)が申請済みの活動には、最初から日付を割り当てておく(共有カレンダーに乗るように)
  const [itemDates, setItemDates] = useState(() => {
    const init = {};
    FRIENDS.forEach(f => f.applied.forEach(id => {
      if (init[id]) return;
      const item = DATA.find(d => d.id === id);
      if (item) init[id] = nextDateFor(item.recurring);
    }));
    return init;
  });
  // 自分の予定: [{id, date, text}]
  const [ownPlans, setOwnPlans] = useState([]);
  // 活動ごとのメモ: { [itemId]: "テキスト" }
  const [notes, setNotes] = useState({});
  // カレンダーで表示中の月・選択中の日
  const [calMonth, setCalMonth] = useState(() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); });
  const [selDay, setSelDay] = useState(() => iso(new Date()));
  // 自分の予定の追加モーダル
  const [showAddOwn, setShowAddOwn] = useState(false);
  const [ownText, setOwnText] = useState("");
  const [ownDate, setOwnDate] = useState(() => iso(new Date()));
  // 友達ページ: 開いている部屋(グループid)と、部屋カレンダーの選択日・表示月
  const [openRoom, setOpenRoom] = useState(null);
  const [roomSelDay, setRoomSelDay] = useState(() => iso(new Date()));
  const [roomMonth, setRoomMonth] = useState(() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); });

  const t = T[lang];

  const toggle = (arr, set, k) => set(arr.includes(k) ? arr.filter(x => x !== k) : [...arr, k]);
  const clearFilters = () => { setFArea([]); setFContent([]); setFEffort([]); setFTime("full"); setQuery(""); };

  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };

  /* フィルタ + 検索 */
  const results = DATA.filter(d => {
    if (d.type !== "volunteer") return false;
    if (fArea.length && !fArea.includes(d.area)) return false;
    if (fContent.length && !d.tags.some(tg => fContent.includes(tg))) return false;
    if (fEffort.length && !fEffort.includes(d.diff)) return false;
    if (fTime === "short" && d.dur > 2) return false;
    if (fTime === "half" && d.dur > 4) return false;
    if (query.trim()) {
      const q = query.toLowerCase();
      const hay = (d.name + " " + (d.org||"") + " " + d.en + " " + d.ja).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const activeFilterCount = fArea.length + fContent.length + fEffort.length + (fTime !== "full" ? 1 : 0);
  const openItem = openId ? DATA.find(d => d.id === openId) : null;

  /* ブックマーク選択を開く */
  const openBmSheet = (id) => {
    setBmDraft(bookmarks[id] ? [...bookmarks[id]] : []);
    setBmSheetFor(id);
  };
  /* ブックマークシート内の選択トグル */
  const toggleBmMe = () => setBmDraft(bmDraft.includes("me") ? [] : ["me"]);
  const toggleBmGroup = (gid) => {
    const withoutMe = bmDraft.filter(x => x !== "me");
    setBmDraft(withoutMe.includes(gid) ? withoutMe.filter(x => x !== gid) : [...withoutMe, gid]);
  };
  const saveBm = () => {
    const id = bmSheetFor;
    if (bmDraft.length === 0) {
      const next = { ...bookmarks }; delete next[id]; setBookmarks(next);
    } else {
      setBookmarks({ ...bookmarks, [id]: bmDraft });
      // まだ日付が割り当てられていなければ、開催頻度から仮の日付を付ける
      if (!itemDates[id]) {
        const item = DATA.find(d => d.id === id);
        setItemDates({ ...itemDates, [id]: nextDateFor(item.recurring) });
      }
      const groups = bmDraft.filter(x => x !== "me");
      flash(groups.length ? t.savedToGroups(groups.length) : t.savedToMe);
    }
    setBmSheetFor(null);
  };

  /* 申請ボタン: Kanu Hawaiiを開いて、確認ウィンドウを予約 */
  const doApply = (item) => {
    if (item.url) window.open(item.url, "_blank", "noopener");
    setApplyConfirmFor(item.id);
  };

  /* ある日付にひもづく予定を集める(申請済み/ブックマーク/自分の予定) */
  const eventsOn = (dayIso) => {
    const evs = [];
    Object.entries(itemDates).forEach(([id, dt]) => {
      if (dt !== dayIso) return;
      const item = DATA.find(d => d.id === id);
      if (!item) return;
      if (applied[id]) evs.push({ kind:"applied", item });
      else if (bookmarks[id]) evs.push({ kind:"bookmark", item });
    });
    ownPlans.filter(p => p.date === dayIso).forEach(p => evs.push({ kind:"own", plan:p }));
    return evs;
  };

  /* その月のうち、予定がある日を種類つきで把握(ドット表示用) */
  const monthDots = {};
  Object.entries(itemDates).forEach(([id, dt]) => {
    const d = parseIso(dt);
    if (!sameYM(d, calMonth)) return;
    if (!monthDots[dt]) monthDots[dt] = {};
    if (applied[id]) monthDots[dt].applied = true;
    else if (bookmarks[id]) monthDots[dt].bookmark = true;
  });
  ownPlans.forEach(p => {
    const d = parseIso(p.date);
    if (!sameYM(d, calMonth)) return;
    if (!monthDots[p.date]) monthDots[p.date] = {};
    monthDots[p.date].own = true;
  });

  /* 確定(申請済み)の時間を2種類で集計:
     done = 開催日が今日以前に過ぎた実績分 / planned = 予定も含めた総合分 */
  const todayIso = iso(new Date());
  const appliedIds = Object.keys(applied).filter(id => applied[id]);
  const doneHours = appliedIds.reduce((sum, id) => {
    const it = DATA.find(d => d.id === id);
    const dt = itemDates[id];
    if (!it || !dt) return sum;
    return dt <= todayIso ? sum + it.dur : sum;   // 開催日が今日以前=済んだ活動
  }, 0);
  const plannedHours = appliedIds.reduce((sum, id) => {
    const it = DATA.find(d => d.id === id);
    return it ? sum + it.dur : sum;               // 申請済みすべて(予定含む)
  }, 0);

  /* カレンダーのマス目(前月の余白含む) */
  const calCells = (() => {
    const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
    const startPad = first.getDay();
    const daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(calMonth.getFullYear(), calMonth.getMonth(), d));
    return cells;
  })();

  const addOwnPlan = () => {
    if (!ownText.trim()) return;
    setOwnPlans([...ownPlans, { id:"own"+Date.now(), date:ownDate, text:ownText.trim() }]);
    setOwnText(""); setShowAddOwn(false); setSelDay(ownDate);
    if (!sameYM(parseIso(ownDate), calMonth)) setCalMonth(new Date(parseIso(ownDate).getFullYear(), parseIso(ownDate).getMonth(), 1));
  };
  const removeOwnPlan = (pid) => setOwnPlans(ownPlans.filter(p => p.id !== pid));

  /* ---- 友達ページ ---- */
  const roomMembers = (gid) => FRIENDS.filter(f => f.groups.includes(gid));

  /* 部屋のカレンダーに乗る予定を日付ごとに集める。
     自分がそのグループにブックマーク/申請した活動 + 友達がその活動に申請している状況 */
  const roomEventsOn = (gid, dayIso) => {
    const evs = [];
    // 自分がこのグループに保存した活動
    Object.entries(bookmarks).forEach(([id, groups]) => {
      if (!groups.includes(gid)) return;
      if (itemDates[id] !== dayIso) return;
      const item = DATA.find(d => d.id === id);
      if (item) evs.push({ item, mine:true, applied:!!applied[id] });
    });
    // 友達が申請している活動(同じ日付に割り当てられているもの)
    const members = roomMembers(gid);
    const friendItemIds = new Set();
    members.forEach(f => f.applied.forEach(id => friendItemIds.add(id)));
    friendItemIds.forEach(id => {
      if (itemDates[id] !== dayIso) return;
      if (evs.some(e => e.item.id === id)) return; // 自分の分と重複しない
      const item = DATA.find(d => d.id === id);
      if (item) evs.push({ item, mine:false, applied:false });
    });
    return evs;
  };

  /* 部屋カレンダーのドット表示用 */
  const roomDots = (gid) => {
    const dots = {};
    Object.entries(bookmarks).forEach(([id, groups]) => {
      if (!groups.includes(gid)) return;
      const dt = itemDates[id]; if (!dt) return;
      const d = parseIso(dt); if (!sameYM(d, roomMonth)) return;
      if (!dots[dt]) dots[dt] = {};
      if (applied[id]) dots[dt].applied = true; else dots[dt].bookmark = true;
    });
    roomMembers(gid).forEach(f => f.applied.forEach(id => {
      const dt = itemDates[id]; if (!dt) return;
      const d = parseIso(dt); if (!sameYM(d, roomMonth)) return;
      if (!dots[dt]) dots[dt] = {};
      dots[dt].friend = true;
    }));
    return dots;
  };

  /* ある活動に「参加する側」のメンバー一覧(自分＋友達) */
  const goingMembers = (gid, itemId) => {
    const list = [];
    if (applied[itemId] && bookmarks[itemId]?.includes(gid)) list.push({ id:"me", name:t.you, emoji:"⭐", mine:true, applied:true });
    else if (bookmarks[itemId]?.includes(gid)) list.push({ id:"me", name:t.you, emoji:"⭐", mine:true, applied:false });
    roomMembers(gid).forEach(f => { if (f.applied.includes(itemId)) list.push({ ...f, applied:true }); });
    return list;
  };

  const roomCalCells = (() => {
    const first = new Date(roomMonth.getFullYear(), roomMonth.getMonth(), 1);
    const startPad = first.getDay();
    const daysInMonth = new Date(roomMonth.getFullYear(), roomMonth.getMonth()+1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(roomMonth.getFullYear(), roomMonth.getMonth(), d));
    return cells;
  })();


  return (
    <div style={{ minHeight:"100vh", background:C.skyPale, fontFamily:"Poppins,sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box;margin:0;padding:0}
.app-shell{max-width:440px;margin:0 auto;padding-bottom:88px;position:relative;min-height:100vh;}
@media (min-width:700px){ .app-shell{max-width:560px;} }
`}</style>

      <div className="app-shell">

        {/* NAV */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
          padding:"13px 20px", background:`linear-gradient(100deg,${C.sky},${C.skyDark})`,
          position:"sticky", top:0, zIndex:20 }}>
          <div style={{ fontWeight:900, fontSize:16, color:C.white }}>
            <span style={{ fontWeight:300, letterSpacing:"0.06em", opacity:0.88 }}>a&nbsp;little&nbsp;</span>
            <span style={{ fontWeight:900, fontSize:20, color:C.sun }}>V</span>
          </div>
          <button onClick={() => setLang(lang === "en" ? "ja" : "en")}
            style={{ fontSize:11, fontWeight:800, padding:"5px 12px", borderRadius:999,
              border:"2px solid rgba(255,255,255,0.65)", color:C.white,
              background:"rgba(255,255,255,0.18)", cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
            {lang === "en" ? "日本語" : "English"}
          </button>
        </div>

        {/* ===== PUBLIC: 検索ページ or ボランティアページ ===== */}
        {tab === "public" && !openItem && (
          <div style={{ padding:"16px 16px 0" }}>
            {/* 検索バー */}
            <div style={{ display:"flex", gap:8, marginBottom:12 }}>
              <input value={query} onChange={e => setQuery(e.target.value)} placeholder={t.searchPlaceholder}
                style={{ flex:1, minHeight:44, padding:"10px 14px", borderRadius:14, border:`1.5px solid ${C.line}`,
                  fontSize:14, color:C.ink, background:C.white, fontFamily:"Poppins,sans-serif", outline:"none" }} />
              <button onClick={() => setShowFilters(!showFilters)}
                style={{ minHeight:44, padding:"0 14px", borderRadius:14, fontWeight:800, fontSize:12.5,
                  border:`2px solid ${showFilters || activeFilterCount ? C.sky : C.line}`,
                  background: showFilters || activeFilterCount ? C.sky : C.white,
                  color: showFilters || activeFilterCount ? C.white : C.ink,
                  cursor:"pointer", fontFamily:"Poppins,sans-serif", whiteSpace:"nowrap" }}>
                {t.filters}{activeFilterCount ? ` (${activeFilterCount})` : ""}
              </button>
            </div>

            {/* フィルタ */}
            {showFilters && (
              <div style={{ background:C.white, borderRadius:16, border:`1.5px solid ${C.line}`,
                padding:"14px 16px", marginBottom:12 }}>
                {[
                  { label:t.fArea, opts:t.areas, val:fArea, set:setFArea },
                  { label:t.fContent, opts:t.contents, val:fContent, set:setFContent },
                  { label:t.fEffort, opts:t.efforts, val:fEffort, set:setFEffort },
                ].map((row, i) => (
                  <div key={i} style={{ marginBottom:12 }}>
                    <div style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.1em", marginBottom:7 }}>{row.label}</div>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:7 }}>
                      {Object.entries(row.opts).map(([k, v]) =>
                        <Chip key={k} label={v} active={row.val.includes(k)} onClick={() => toggle(row.val, row.set, k)} />)}
                    </div>
                  </div>
                ))}
                <div style={{ marginBottom:4 }}>
                  <div style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.1em", marginBottom:7 }}>{t.fTime}</div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:7 }}>
                    {Object.entries(t.times).map(([k, v]) =>
                      <Chip key={k} label={v} active={fTime === k} onClick={() => setFTime(k)} />)}
                  </div>
                </div>
                {activeFilterCount > 0 && (
                  <button onClick={clearFilters}
                    style={{ marginTop:12, fontSize:12, fontWeight:800, color:C.fade, background:"none",
                      border:"none", cursor:"pointer", padding:0, fontFamily:"Poppins,sans-serif" }}>
                    {t.clear} ✕
                  </button>
                )}
              </div>
            )}

            <div style={{ fontSize:11, fontWeight:800, color:C.fade, letterSpacing:"0.06em", marginBottom:10, paddingLeft:2 }}>
              {t.resultsN(results.length)}
            </div>

            {results.length === 0 && (
              <div style={{ background:C.warn, border:`1.5px solid ${C.warnB}`, borderRadius:14,
                padding:"12px 14px", fontSize:12.5, color:C.warnT, lineHeight:1.5, fontFamily:"Poppins,sans-serif" }}>
                {t.noResults}
              </div>
            )}

            {results.map(item => (
              <ListCard key={item.id} item={item} t={t} lang={lang}
                onOpen={() => setOpenId(item.id)}
                bookmarked={!!bookmarks[item.id]} applied={!!applied[item.id]} />
            ))}
          </div>
        )}

        {/* ===== ボランティアページ(詳細) ===== */}
        {tab === "public" && openItem && (
          <div style={{ padding:"16px 16px 0" }}>
            <button onClick={() => setOpenId(null)}
              style={{ fontSize:12.5, fontWeight:700, color:C.fade, background:"none", border:"none",
                cursor:"pointer", padding:0, marginBottom:14, fontFamily:"Poppins,sans-serif" }}>
              {t.detailBack}
            </button>

            {/* ヘッダー */}
            <div style={{ borderRadius:20, overflow:"hidden", border:"1.5px solid #9ADBB6",
              boxShadow:"0 4px 20px rgba(0,168,79,0.12)", marginBottom:16 }}>
              <div style={{ background:`linear-gradient(110deg,${C.sky} 0%,#0DD8EE 60%,#00E5BE 100%)`,
                padding:"14px 18px", position:"relative", overflow:"hidden" }}>
                <div style={{ position:"absolute", inset:0,
                  backgroundImage:"radial-gradient(circle,rgba(255,255,255,0.22) 1.5px,transparent 1.5px)",
                  backgroundSize:"14px 14px" }} />
                <div style={{ position:"relative" }}>
                  <div style={{ fontWeight:900, fontSize:18, color:C.white, lineHeight:1.3, fontFamily:"Poppins,sans-serif" }}>
                    {openItem.name}
                  </div>
                  {openItem.org && <div style={{ fontSize:12, color:"rgba(255,255,255,0.9)", marginTop:5, fontWeight:600 }}>{openItem.org}</div>}
                </div>
              </div>
              <div style={{ background:C.leafLight, padding:"14px 18px" }}>
                <div style={{ display:"flex", gap:14, fontSize:12, color:C.fade, flexWrap:"wrap", fontFamily:"Poppins,sans-serif" }}>
                  <span>⏱ {openItem.dur}{t.hours}</span>
                  <span>📍 {t.areas[openItem.area]}</span>
                  <span style={{ fontWeight:800, color:C.leaf }}>💵 {t.free}</span>
                  {openItem.recurring && <span>🔁 {t.every[openItem.recurring]}</span>}
                </div>
              </div>
            </div>

            {/* 説明 */}
            <div style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.12em", marginBottom:7 }}>{t.aboutTitle}</div>
            <p style={{ fontSize:13.5, color:C.ink, lineHeight:1.7, marginBottom:16, fontFamily:"Poppins,sans-serif" }}>
              {lang === "ja" ? openItem.ja : openItem.en}
            </p>

            {/* 参加方法 */}
            <div style={{ background:C.white, borderRadius:14, border:`1.5px solid ${C.line}`, padding:"12px 15px", marginBottom:16 }}>
              <div style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.1em", marginBottom:4 }}>{t.joinTitle}</div>
              <div style={{ fontSize:13, fontWeight:700, color:C.ink, fontFamily:"Poppins,sans-serif" }}>{t.bookLabel[openItem.booking]}</div>
            </div>

            {/* 申請者一覧(次回) */}
            <div style={{ background:C.skyPale, borderRadius:14, border:`1px dashed ${C.sky}`, padding:"12px 15px", marginBottom:20 }}>
              <div style={{ fontSize:11, fontWeight:800, color:C.sky, marginBottom:4 }}>👥 {t.whoTitle}</div>
              <div style={{ fontSize:11.5, color:C.fade, lineHeight:1.5, fontFamily:"Poppins,sans-serif" }}>{t.whoSoon}</div>
            </div>

            {/* 申請 + ブックマークボタン */}
            <div style={{ display:"flex", gap:10, marginBottom:8 }}>
              <button onClick={() => doApply(openItem)}
                style={{ flex:1, minHeight:52, borderRadius:16, fontWeight:900, fontSize:13.5,
                  background: applied[openItem.id] ? C.leaf : C.sun,
                  color: applied[openItem.id] ? C.white : C.sunText,
                  border:"none", cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {applied[openItem.id] ? t.applied : t.applyBtn}
              </button>
              <button onClick={() => openBmSheet(openItem.id)}
                style={{ minWidth:120, minHeight:52, borderRadius:16, fontWeight:800, fontSize:13,
                  background: bookmarks[openItem.id] ? C.leafLight : C.white,
                  color: bookmarks[openItem.id] ? C.leafDark : C.ink,
                  border:`2px solid ${bookmarks[openItem.id] ? C.leaf : C.line}`,
                  cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {bookmarks[openItem.id] ? t.bookmarkedBtn : t.bookmarkBtn}
              </button>
            </div>
          </div>
        )}

        {/* ===== 個人ページ(カレンダー) ===== */}
        {tab === "personal" && (
          <div style={{ padding:"16px 16px 0" }}>
            <h2 style={{ fontWeight:900, fontSize:22, color:C.ink, letterSpacing:"-0.02em", marginBottom:14 }}>
              📅 {t.calTitle}
            </h2>

            {/* 活動時間: 実績(済み)と予定込みの総合 */}
            <div style={{ display:"flex", gap:10, marginBottom:16 }}>
              <div style={{ flex:1, background:`linear-gradient(110deg,${C.leaf},#00C85E)`, borderRadius:16,
                padding:"13px 16px", color:C.white }}>
                <div style={{ fontSize:10, fontWeight:700, opacity:0.9, letterSpacing:"0.04em" }}>{t.hoursDoneT}</div>
                <div style={{ fontWeight:900, fontSize:27, lineHeight:1.1, marginTop:2 }}>
                  {doneHours}<span style={{ fontSize:14, fontWeight:800 }}> {t.hoursUnit}</span>

                  background:`linear-gradient(110deg,${C.sky},#00D8EE)`, color:C.white,
                  fontWeight:900, fontSize:15, border:"none", cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {bmDraft.length === 0 ? t.bmRemove : t.bmSave}
              </button>
            </div>
          </div>
        )}

        {/* ===== 申請確認ウィンドウ ===== */}
        {applyConfirmFor && (
          <div style={{ position:"fixed", inset:0, background:"rgba(14,40,48,0.45)", zIndex:50,
            display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>
            <div style={{ width:"100%", maxWidth:360, background:C.white, borderRadius:22,
              padding:"24px 22px", fontFamily:"Poppins,sans-serif", textAlign:"center" }}>
              <div style={{ fontSize:40, marginBottom:12 }}>📝</div>
              <h3 style={{ fontWeight:900, fontSize:19, color:C.ink, marginBottom:8 }}>{t.applyConfirmT}</h3>
              <p style={{ fontSize:12.5, color:C.fade, lineHeight:1.6, marginBottom:20 }}>{t.applyConfirmD}</p>
              <button onClick={() => {
                  setApplied({ ...applied, [applyConfirmFor]:true });
                  if (!itemDates[applyConfirmFor]) {
                    const item = DATA.find(d => d.id === applyConfirmFor);
                    setItemDates({ ...itemDates, [applyConfirmFor]: nextDateFor(item.recurring) });
                  }
                  setApplyConfirmFor(null); flash(t.applied);
                }}
                style={{ width:"100%", padding:"14px", borderRadius:14, marginBottom:10,
                  background:C.leaf, color:C.white, fontWeight:900, fontSize:14, border:"none",
                  cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {t.applyDone}
              </button>
              <button onClick={() => setApplyConfirmFor(null)}
                style={{ width:"100%", padding:"12px", borderRadius:14, background:"none",
                  color:C.fade, fontWeight:800, fontSize:13, border:`1.5px solid ${C.line}`,
                  cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {t.applyCancel}
              </button>
            </div>
          </div>
        )}

        {/* ===== 下部タブバー ===== */}
        <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
          width:"100%", maxWidth:440, background:C.white, borderTop:`1.5px solid ${C.line}`,
          display:"flex", zIndex:30 }}>
          {[
            { id:"public", icon:"🔍", label:t.tabPublic },
            { id:"personal", icon:"📅", label:t.tabPersonal },
            { id:"friends", icon:"👥", label:t.tabFriends },
          ].map(tb => (
            <button key={tb.id} onClick={() => { setTab(tb.id); setOpenId(null); setOpenRoom(null); }}
              style={{ flex:1, padding:"10px 0 12px", background:"none", border:"none", cursor:"pointer",
                display:"flex", flexDirection:"column", alignItems:"center", gap:3, fontFamily:"Poppins,sans-serif" }}>
              <span style={{ fontSize:20, filter: tab === tb.id ? "none" : "grayscale(1) opacity(0.5)" }}>{tb.icon}</span>
              <span style={{ fontSize:10, fontWeight:800, color: tab === tb.id ? C.sky : C.fade }}>{tb.label}</span>
            </button>
          ))}
        </div>

      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
