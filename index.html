/* どの活動にも申請者が数人いるように、p17以降の人を機械的に割り当てる。
   最初からいる友達(p1/p2)は増やさないので「友達が参加する活動」は限られたままになる */
(function seedSignups() {
  const MIN = 3;
  const fillers = PEOPLE.filter(p => Number(p.id.slice(1)) >= 17);
  let cursor = 0;
  DATA.filter(d => d.type === "volunteer").forEach(item => {
    const already = PEOPLE.filter(p => p.signedUp.includes(item.id)).length;
    for (let k = already; k < MIN; k++) {
      const p = fillers[cursor % fillers.length];
      cursor++;
      if (!p.signedUp.includes(item.id)) p.signedUp.push(item.id);
    }
  });
})();

const parseIso = (s) => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const sameYM = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth();

/* ブックマーク/申請したとき、開催頻度から「次のそれっぽい日」を割り当てる。
   実データの日付がないので、デモとして現実的な近い将来の日付を生成する。
   weekly=次の土曜, monthly=来月の第3土曜あたり, varies=10日後 */
function nextDateFor(recurring) {
  const now = new Date();
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (recurring === "weekly") {
    const day = d.getDay();
    const add = ((6 - day) + 7) % 7 || 7;   // 次の土曜(今日が土曜なら来週)
    d.setDate(d.getDate() + add);
  } else if (recurring === "monthly") {
    d.setDate(d.getDate() + 18);            // だいたい2〜3週間後
  } else {
    d.setDate(d.getDate() + 10);            // varies: 10日後
  }
  return iso(d);
}

/* ---- 部品 ---- */
function Chip({ label, active, onClick }) {
  return (
    <button onClick={onClick} style={{
      padding:"7px 14px", borderRadius:999, fontSize:12.5, fontWeight:700, cursor:"pointer",
      border:`2px solid ${active ? C.sky : C.line}`,
      background: active ? C.sky : C.white, color: active ? C.white : C.ink,
      transition:"all 0.15s", fontFamily:"Poppins,sans-serif", whiteSpace:"nowrap",
    }}>{label}</button>
  );
}

/* ブックマークのリボンアイコン(押されていれば塗りつぶし) */
function BookmarkIcon({ filled, size = 18, color }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24"
      fill={filled ? color : "none"} stroke={color} strokeWidth="2.2"
      strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0 }}>
      <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-5-7 5V4a1 1 0 0 1 1-1z"/>
    </svg>
  );
}

function ListCard({ item, t, lang, onOpen, bookmarked, applied, friendsGoing = [] }) {
  return (
    <button onClick={onOpen}
      style={{ width:"100%", textAlign:"left", background:C.white, borderRadius:18,
        border:`1.5px solid ${friendsGoing.length ? C.sun : C.line}`, padding:0, marginBottom:12, cursor:"pointer",
        overflow:"hidden", display:"block" }}>
      {/* 友達が参加していると上に黄色い帯が出る(おすすめ) */}
      {friendsGoing.length > 0 && (
        <div style={{ display:"flex", alignItems:"center", gap:7, padding:"7px 14px",
          background:"rgba(255,213,53,0.22)" }}>
          <div style={{ display:"flex" }}>
            {friendsGoing.slice(0, 3).map((f, i) => (
              <span key={f.id} style={{ width:22, height:22, borderRadius:"50%", background:C.white,
                border:`1.5px solid ${C.sun}`, display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:12, marginLeft: i === 0 ? 0 : -7 }}>{f.emoji}</span>
            ))}
          </div>
          <span style={{ fontSize:11, fontWeight:800, color:C.sunText, fontFamily:"Poppins,sans-serif" }}>
            💛 {t.friendsGoingLabel(friendsGoing.slice(0, 2).map(f => f.name).join(", ")
                 + (friendsGoing.length > 2 ? " " + t.andMore(friendsGoing.length - 2) : ""))}
          </span>
        </div>
      )}
      <div style={{ padding:"13px 16px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
          <div style={{ fontWeight:800, fontSize:14.5, color:C.ink, lineHeight:1.35, fontFamily:"Poppins,sans-serif" }}>
            {item.name}
          </div>
          <div style={{ display:"flex", gap:4, flexShrink:0 }}>
            {applied && <span style={{ fontSize:11, fontWeight:800, color:C.leaf }}>✓</span>}
            {bookmarked && <BookmarkIcon filled size={15} color={C.leaf} />}
          </div>
        </div>
        {item.org && <div style={{ fontSize:11, color:C.fade, marginTop:3, fontWeight:600, fontFamily:"Poppins,sans-serif" }}>{item.org}</div>}
        <div style={{ display:"flex", gap:12, marginTop:8, fontSize:11, color:C.fade, flexWrap:"wrap", fontFamily:"Poppins,sans-serif" }}>
          <span>⏱ {item.dur}{t.hours}</span>
          <span>📍 {t.areas[item.area]}</span>
          <span style={{ fontWeight:800, color:C.leaf }}>💵 {t.free}</span>
          {item.recurring && <span>🔁 {t.every[item.recurring]}</span>}
        </div>
      </div>
    </button>
  );
}

    g2:[], g3:[],
  });
  const [talkDraft, setTalkDraft] = useState("");
  // 当日の参加有無: デモで「2時間前」になった活動id / 自分の回答 / プッシュ通知バナー
  const [dayOfActive, setDayOfActive] = useState({});   // { itemId: true } = 2時間前モード
  const [myAttend, setMyAttend] = useState({});         // { itemId: "going"|"not" }
  const [pushFor, setPushFor] = useState(null);         // プッシュ通知バナーで表示中の活動id
  const [openId, setOpenId] = useState(null);      // ボランティアページで開いている活動
  const [query, setQuery] = useState("");
  const [showFilters, setShowFilters] = useState(false);
  const [fArea, setFArea] = useState([]);
  const [fContent, setFContent] = useState([]);
  const [fEffort, setFEffort] = useState([]);
  const [fTime, setFTime] = useState("full");

  // ブックマーク: { [itemId]: ["me"] または ["g1","g2"] }
  const [bookmarks, setBookmarks] = useState({});
  // 申請済み: Set的に { [itemId]: true }
  const [applied, setApplied] = useState({});
  // モーダル
  const [bmSheetFor, setBmSheetFor] = useState(null);   // ブックマーク選択中の活動id
  const [bmDraft, setBmDraft] = useState([]);           // 選択途中の状態
  const [applyConfirmFor, setApplyConfirmFor] = useState(null); // 申請確認中の活動id
  const [toast, setToast] = useState("");

  // カレンダー: 活動id → 割り当て日(ISO)。ブックマーク/申請時に埋まる。
  // 友達(ダミー)が申請済みの活動には、最初から日付を割り当てておく(共有カレンダーに乗るように)
  const [itemDates, setItemDates] = useState(() => {
    const init = {};
    PEOPLE.forEach(f => f.signedUp.forEach(id => {
      if (init[id]) return;
      const item = DATA.find(d => d.id === id);
      if (item) init[id] = nextDateFor(item.recurring);
    }));
    return init;
  });
  // 自分の予定: [{id, date, text}]
  const [ownPlans, setOwnPlans] = useState([]);
  // 活動ごとのメモ: { [itemId]: "テキスト" }
  const [notes, setNotes] = useState({});
  // 記念投稿: { [itemId]: { photo: dataURL|null, comment: "" } }
  const [posts, setPosts] = useState({});
  // カレンダーで表示中の月・選択中の日
  const [calMonth, setCalMonth] = useState(() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); });
  const [selDay, setSelDay] = useState(() => iso(new Date()));
  const [personalSub, setPersonalSub] = useState("calendar"); // "calendar" | "history"
  // 自分の予定の追加モーダル
  const [showAddOwn, setShowAddOwn] = useState(false);
  const [ownText, setOwnText] = useState("");
  const [ownDate, setOwnDate] = useState(() => iso(new Date()));
  // 友達ページ: 開いている部屋(グループid)と、部屋カレンダーの選択日・表示月
  const [openRoom, setOpenRoom] = useState(null);
  const [roomSelDay, setRoomSelDay] = useState(() => iso(new Date()));
  const [roomMonth, setRoomMonth] = useState(() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); });

  const t = T[lang];

  /* アカウント作成 */
  const createAccount = () => {
    if (!obNick.trim()) { setObError(true); return; }
    setAccount({ nick: obNick.trim(), avatar: obAvatar, email: obEmail.trim() });
    setScreen("app");
  };
  /* デモ用アカウントで開始(プレゼン用: すでに何度か参加している状態) */
  const loadDemoAccount = () => {
    setAccount({ nick:DEMO_ACCOUNT.nick, avatar:DEMO_ACCOUNT.avatar, email:DEMO_ACCOUNT.email });
    setMyHistory(DEMO_ACCOUNT.history);
    const ap = {}; const dates = {};
    // これから参加する分
    DEMO_ACCOUNT.applied.forEach(id => {
      ap[id] = true;
      const item = DATA.find(d => d.id === id);
      if (item) dates[id] = nextDateFor(item.recurring);
    });
    // 今日ひらかれる活動(カレンダーにも今日として入る)
    if (DEMO_ACCOUNT.today) {
      ap[DEMO_ACCOUNT.today] = true;
      dates[DEMO_ACCOUNT.today] = iso(new Date());
    }
    // 参加済みの分(履歴タブに出る)。日付を過去にする
    const nt = {}; const ps = {};
    DEMO_ACCOUNT.past.forEach(rec => {
      ap[rec.id] = true;
      const d = new Date();
      d.setDate(d.getDate() - rec.daysAgo);
      dates[rec.id] = iso(d);
      if (rec.note) nt[rec.id] = rec.note;
      if (rec.comment) ps[rec.id] = { photo:null, comment:rec.comment };
    });
    setApplied(ap);
    setItemDates(prev => ({ ...prev, ...dates }));
    setNotes(nt);
    setPosts(ps);
    setScreen("app");
  };

  const skipOnboarding = () => {
    setAccount({ nick: lang === "ja" ? "あなた" : "You", avatar: "⭐", email: "" });
    setScreen("app");
  };
  const signOut = () => {
    setAccount(null); setScreen("onboarding");
    setObNick(""); setObAvatar(AVATARS[0]); setObEmail(""); setObError(false);
    setTab("public"); setOpenId(null); setOpenRoom(null);
  };
  /* 「あなた」の表示名とアイコン(未作成時のフォールバックつき) */
  const meName = account ? account.nick : (lang === "ja" ? "あなた" : "You");
  const meAvatar = account ? account.avatar : "⭐";

  const toggle = (arr, set, k) => set(arr.includes(k) ? arr.filter(x => x !== k) : [...arr, k]);
  const clearFilters = () => { setFArea([]); setFContent([]); setFEffort([]); setFTime("full"); setQuery(""); };

  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };

  /* フィルタ + 検索 */
  const results = DATA.filter(d => {
    if (d.type !== "volunteer") return false;
    if (fArea.length && !fArea.includes(d.area)) return false;
    if (fContent.length && !d.tags.some(tg => fContent.includes(tg))) return false;
    if (fEffort.length && !fEffort.includes(d.diff)) return false;
    if (fTime === "short" && d.dur > 2) return false;
    if (fTime === "half" && d.dur > 4) return false;
    if (query.trim()) {
      const q = query.toLowerCase();
      const hay = (d.name + " " + (d.org||"") + " " + d.en + " " + d.ja).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  /* その活動に申請している友達 */
  const friendsIn = (itemId) => people.filter(pp => pp.friend && pp.signedUp.includes(itemId));

  /* 友達が参加している活動を上に持ってくる(おすすめ) */
  const sortedResults = [...results].sort((a, b) => friendsIn(b.id).length - friendsIn(a.id).length);
  const friendPickCount = results.filter(d => friendsIn(d.id).length > 0).length;

  const activeFilterCount = fArea.length + fContent.length + fEffort.length + (fTime !== "full" ? 1 : 0);
  const openItem = openId ? DATA.find(d => d.id === openId) : null;

  /* ブックマーク選択を開く */
  const openBmSheet = (id) => {
    setBmDraft(bookmarks[id] ? [...bookmarks[id]] : []);
    setBmSheetFor(id);
  };
  /* ブックマークシート内の選択トグル */
  const toggleBmMe = () => setBmDraft(bmDraft.includes("me") ? [] : ["me"]);
  const toggleBmGroup = (gid) => {
    const withoutMe = bmDraft.filter(x => x !== "me");
    setBmDraft(withoutMe.includes(gid) ? withoutMe.filter(x => x !== gid) : [...withoutMe, gid]);
  };
  const saveBm = () => {
    const id = bmSheetFor;
    if (bmDraft.length === 0) {
      const next = { ...bookmarks }; delete next[id]; setBookmarks(next);
    } else {
      setBookmarks({ ...bookmarks, [id]: bmDraft });
      // まだ日付が割り当てられていなければ、開催頻度から仮の日付を付ける
      if (!itemDates[id]) {
        const item = DATA.find(d => d.id === id);
        setItemDates({ ...itemDates, [id]: nextDateFor(item.recurring) });
      }
      const groups = bmDraft.filter(x => x !== "me");
      flash(groups.length ? t.savedToGroups(groups.length) : t.savedToMe);
    }
    setBmSheetFor(null);
  };

  /* 申請ボタン: Kanu Hawaiiを開いて、確認ウィンドウを予約 */
  const doApply = (item) => {
    if (item.url) window.open(item.url, "_blank", "noopener");
    setApplyConfirmFor(item.id);
  };

  /* ある日付にひもづく予定を集める(申請済み/ブックマーク/自分の予定) */
  const eventsOn = (dayIso) => {
    const evs = [];
    Object.entries(itemDates).forEach(([id, dt]) => {
      if (dt !== dayIso) return;
      const item = DATA.find(d => d.id === id);
      if (!item) return;
      if (applied[id]) evs.push({ kind:"applied", item });
      else if (bookmarks[id]) evs.push({ kind:"bookmark", item });
    });
    ownPlans.filter(p => p.date === dayIso).forEach(p => evs.push({ kind:"own", plan:p }));
    return evs;
  };

  /* その月のうち、予定がある日を種類つきで把握(ドット表示用) */
  const monthDots = {};
  Object.entries(itemDates).forEach(([id, dt]) => {
    const d = parseIso(dt);
    if (!sameYM(d, calMonth)) return;
    if (!monthDots[dt]) monthDots[dt] = {};
    if (applied[id]) monthDots[dt].applied = true;
    else if (bookmarks[id]) monthDots[dt].bookmark = true;
  });
  ownPlans.forEach(p => {
    const d = parseIso(p.date);
    if (!sameYM(d, calMonth)) return;
    if (!monthDots[p.date]) monthDots[p.date] = {};
    monthDots[p.date].own = true;
  });

  /* 確定(申請済み)の時間を2種類で集計:
     done = 開催日が今日以前に過ぎた実績分 / planned = 予定も含めた総合分 */
  const todayIso = iso(new Date());
  const appliedIds = Object.keys(applied).filter(id => applied[id]);
  const doneHours = appliedIds.reduce((sum, id) => {
    const it = DATA.find(d => d.id === id);
    const dt = itemDates[id];
    if (!it || !dt) return sum;
    return dt <= todayIso ? sum + it.dur : sum;   // 開催日が今日以前=済んだ活動
  }, 0);
  const plannedHours = appliedIds.reduce((sum, id) => {
    const it = DATA.find(d => d.id === id);
    return it ? sum + it.dur : sum;               // 申請済みすべて(予定含む)
  }, 0);

  /* カレンダーのマス目(前月の余白含む) */
  const calCells = (() => {
    const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
    const startPad = first.getDay();
    const daysInMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(calMonth.getFullYear(), calMonth.getMonth(), d));
    return cells;
  })();

  const addOwnPlan = () => {
    if (!ownText.trim()) return;
    setOwnPlans([...ownPlans, { id:"own"+Date.now(), date:ownDate, text:ownText.trim() }]);
    setOwnText(""); setShowAddOwn(false); setSelDay(ownDate);
    if (!sameYM(parseIso(ownDate), calMonth)) setCalMonth(new Date(parseIso(ownDate).getFullYear(), parseIso(ownDate).getMonth(), 1));
  };
  const removeOwnPlan = (pid) => setOwnPlans(ownPlans.filter(p => p.id !== pid));

  /* これからの予定リスト: 申請済み/ブックマークした活動を日付順に。
     今日以降を上に、過去は下にまとめる */
  const upcomingList = (() => {
    const rows = [];
    Object.entries(itemDates).forEach(([id, dt]) => {
      // 自分が関与しているものだけ(申請済み or ブックマーク済み)
      if (!applied[id] && !bookmarks[id]) return;
      const item = DATA.find(d => d.id === id);
      if (!item) return;
      rows.push({ date: dt, item, applied: !!applied[id] });
    });
    rows.sort((a, b) => a.date.localeCompare(b.date));
    const today = iso(new Date());
    return { future: rows.filter(r => r.date >= today), past: rows.filter(r => r.date < today) };
  })();

  /* 履歴: 申請済み(確定)の活動を対象に、済んだもの/これからで分ける。
     済んだものだけ時間を合計(改善前の doneHours と同じ考え方) */
  const historyRows = (() => {
    const today = iso(new Date());
    const rows = Object.keys(applied).filter(id => applied[id]).map(id => {
      const item = DATA.find(d => d.id === id);
      return item ? { id, item, date: itemDates[id] || null } : null;
    }).filter(Boolean);
    rows.sort((a, b) => (b.date || "").localeCompare(a.date || "")); // 新しい順
    const done = rows.filter(r => r.date && r.date <= today);
    const future = rows.filter(r => !r.date || r.date > today);
    const totalH = done.reduce((s, r) => s + r.item.dur, 0);
    return { done, future, totalH, count: done.length };
  })();

  /* ---- 友達ページ ---- */
  const roomMembers = (gid) => {
    const room = rooms.find(x => x.id === gid);
    if (!room) return [];
    return people.filter(p => room.memberIds.includes(p.id));
  };
  /* 部屋の表示名(自分で作った部屋は name、初期の部屋は言語に合わせて) */
  const roomName = (room) => room.name || (lang === "ja" ? room.ja : room.en);

  /* 友達一覧から新しい部屋を作る */
  const createRoom = () => {
    if (!newRoomName.trim() || newRoomMembers.length === 0) return;
    const id = "g" + Date.now();
    setRooms([...rooms, { id, name:newRoomName.trim(), en:newRoomName.trim(), ja:newRoomName.trim(), memberIds:[...newRoomMembers] }]);
    setNewRoomName(""); setNewRoomMembers([]); setShowNewRoom(false);
    flash(t.roomCreated);
  };

  /* 部屋のカレンダーに乗る予定を日付ごとに集める。
     自分がそのグループにブックマーク/申請した活動 + 友達がその活動に申請している状況 */
  const roomEventsOn = (gid, dayIso) => {
    const evs = [];
    // 自分がこのグループに保存した活動
    Object.entries(bookmarks).forEach(([id, groups]) => {
      if (!groups.includes(gid)) return;
      if (itemDates[id] !== dayIso) return;
      const item = DATA.find(d => d.id === id);
      if (item) evs.push({ item, mine:true, applied:!!applied[id] });
    });
    // 友達が申請している活動(同じ日付に割り当てられているもの)
    const members = roomMembers(gid);
    const friendItemIds = new Set();
    members.forEach(f => f.signedUp.forEach(id => friendItemIds.add(id)));
    friendItemIds.forEach(id => {
      if (itemDates[id] !== dayIso) return;
      if (evs.some(e => e.item.id === id)) return; // 自分の分と重複しない
      const item = DATA.find(d => d.id === id);
      if (item) evs.push({ item, mine:false, applied:false });
    });
    return evs;
  };

  /* 部屋カレンダーのドット表示用 */
  const roomDots = (gid) => {
    const dots = {};
    Object.entries(bookmarks).forEach(([id, groups]) => {
      if (!groups.includes(gid)) return;
      const dt = itemDates[id]; if (!dt) return;
      const d = parseIso(dt); if (!sameYM(d, roomMonth)) return;
      if (!dots[dt]) dots[dt] = {};
      if (applied[id]) dots[dt].applied = true; else dots[dt].bookmark = true;
    });
    roomMembers(gid).forEach(f => f.signedUp.forEach(id => {
      const dt = itemDates[id]; if (!dt) return;
      const d = parseIso(dt); if (!sameYM(d, roomMonth)) return;
      if (!dots[dt]) dots[dt] = {};
      dots[dt].friend = true;
    }));
    return dots;
  };

  /* ある活動に「参加する側」のメンバー一覧(自分＋友達) */
  const goingMembers = (gid, itemId) => {
    const list = [];
    if (applied[itemId] && bookmarks[itemId]?.includes(gid)) list.push({ id:"me", name:meName, emoji:meAvatar, mine:true, applied:true });
    else if (bookmarks[itemId]?.includes(gid)) list.push({ id:"me", name:meName, emoji:meAvatar, mine:true, applied:false });
    roomMembers(gid).forEach(f => { if (f.signedUp.includes(itemId)) list.push({ ...f, applied:true }); });
    return list;
  };

  /* 活動の申請者一覧(グループ横断)＋各自の当日回答ステータス。
     status: "going" | "not" | null(未回答) */
  const applicantsOf = (itemId) => {
    const list = [];
    if (applied[itemId]) {
      list.push({ id:"me", name:meName, emoji:meAvatar, mine:true, friend:false, coCount:0,
                  status: myAttend[itemId] || null, gps: myGps[itemId] || null });
    }
    people.forEach(pp => {
      if (!pp.signedUp.includes(itemId)) return;
      // 自分の参加履歴と重なった数 = 「一緒に参加した回数」
      const coCount = pp.history.filter(h => myHistory.includes(h)).length;
      list.push({ id:pp.id, name:pp.name, emoji:pp.emoji, mine:false,
                  friend: pp.friend, coCount, status: pp.attend[itemId] || null,
                  gps: (pp.gps && pp.gps[itemId]) || null });
    });
    // 並び順: 自分 → 友達(回数多い順) → 友達以外(回数多い順) → 初対面
    return list.sort((a, b) => {
      if (a.mine !== b.mine) return a.mine ? -1 : 1;
      if (a.friend !== b.friend) return a.friend ? -1 : 1;
      return b.coCount - a.coCount;
    });
  };

  /* 未読メッセージ数(自分以外の発言のうち、まだ見ていない分) */
  const unreadOf = (gid) => {
    const all = (talks[gid] || []).length;
    return Math.max(0, all - (readCount[gid] || 0));
  };
  /* トークを開いたら既読にする */
  const openTalk = (gid) => {
    setRoomTab("talk");
    setReadCount({ ...readCount, [gid]: (talks[gid] || []).length });
  };

  /* グループトークに送信 */
  const sendTalk = (gid) => {
    if (!talkDraft.trim()) return;
    const msg = { who: meName, avatar: meAvatar, text: talkDraft.trim(), mine:true };
    const next = [...(talks[gid] || []), msg];
    setTalks({ ...talks, [gid]: next });
    setReadCount({ ...readCount, [gid]: next.length });
    setTalkDraft("");
  };

  /* 友達登録する(アカウント交換) */
  const addFriend = (personId) => {
    setPeople(people.map(pp => pp.id === personId ? { ...pp, friend:true } : pp));
    const target = people.find(pp => pp.id === personId);
    if (target) flash(`${target.name} ${t.friendAdded}`);
  };

  /* 自分が当日回答する(デモ) */
  const answerAttend = (itemId, ans) => {
    setMyAttend({ ...myAttend, [itemId]: ans });
    setPushFor(null);
  };
  /* デモ: 「2時間前」の状態にする(プッシュ通知も出す) */
  const triggerDayOf = (itemId) => {
    setDayOfActive({ ...dayOfActive, [itemId]: true });
    setPushFor(itemId);
  };

  /* 記念投稿: 端末から画像を選んで表示(dataURLに変換して保持。デモなので再読込で消える) */
  /* 下書きの中身(まだ投稿していなければ下書き、なければ投稿済みの内容) */
  const draftOf = (itemId) => postDraft[itemId] || posts[itemId] || { photo:null, comment:"" };

  const pickPhoto = (itemId, file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      setPostDraft(prev => ({ ...prev, [itemId]: { ...(prev[itemId] || posts[itemId] || { photo:null, comment:"" }), photo: ev.target.result } }));
    };
    reader.readAsDataURL(file);
  };

  /* 投稿ボタン: 下書きを確定する */
  const submitPost = (itemId) => {
    const d = draftOf(itemId);
    if (!d.photo && !(d.comment || "").trim()) return;
    setPosts({ ...posts, [itemId]: d });
    setEditingPost({ ...editingPost, [itemId]: false });
    flash(t.postSaved);
  };
  const setPostComment = (itemId, text) => {
    setPostDraft(prev => ({ ...prev, [itemId]: { ...(prev[itemId] || posts[itemId] || { photo:null, comment:"" }), comment: text } }));
  };
  /* 同じ活動(毎週開催など)への過去の投稿を集める。今は自分の投稿のみだが、
     将来は他メンバーの投稿もここに集約できる構造 */
  const pastPostsFor = (item) => {
    // recurring が weekly/monthly のとき、その活動自身の投稿を「過去の回」として見せる
    const p = posts[item.id];
    if (!p || (!p.photo && !p.comment)) return [];
    return [{ who: meName, avatar: meAvatar, ...p }];
  };

  const roomCalCells = (() => {
    const first = new Date(roomMonth.getFullYear(), roomMonth.getMonth(), 1);
    const startPad = first.getDay();
    const daysInMonth = new Date(roomMonth.getFullYear(), roomMonth.getMonth()+1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(roomMonth.getFullYear(), roomMonth.getMonth(), d));
    return cells;
  })();


  /* ===== アカウント作成(オンボーディング)画面 ===== */
  if (screen === "onboarding") {
    return (
      <div style={{ minHeight:"100vh", background:C.skyPale, fontFamily:"Poppins,sans-serif" }}>
        <style>{`@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box;margin:0;padding:0}
.ob-shell{max-width:440px;margin:0 auto;min-height:100vh;}
@media (min-width:700px){ .ob-shell{max-width:520px;} }`}</style>
        <div className="ob-shell">
          {/* ヘッダー */}
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
            padding:"13px 20px", background:`linear-gradient(100deg,${C.sky},${C.skyDark})` }}>
            <div style={{ fontWeight:900, fontSize:16, color:C.white }}>

            </div>

            {/* メール */}
            <div style={{ marginBottom:26 }}>
              <div style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.1em", marginBottom:7 }}>{t.obEmail}</div>
              <input type="email" value={obEmail} onChange={e => setObEmail(e.target.value)}
                placeholder={t.obEmailPlaceholder}
                style={{ width:"100%", minHeight:48, padding:"12px 14px", borderRadius:14,
                  border:`1.5px solid ${C.line}`, fontSize:15, color:C.ink,
                  background:C.white, fontFamily:"Poppins,sans-serif", outline:"none" }} />
              <p style={{ fontSize:10.5, color:C.fade, marginTop:6, fontFamily:"Poppins,sans-serif" }}>{t.obEmailNote}</p>
            </div>

            <button onClick={createAccount}
              style={{ width:"100%", padding:"17px", borderRadius:18, background:C.sun, color:C.sunText,
                fontWeight:900, fontSize:16, border:"none", cursor:"pointer",
                boxShadow:"0 8px 24px rgba(255,213,53,0.4)", fontFamily:"Poppins,sans-serif" }}>
              {t.obCreate}
            </button>
            {/* デモ用: すでに何度か参加している人の状態で開始(プレゼン用) */}
            <div style={{ marginTop:16, padding:"14px 16px", borderRadius:16, background:C.leafLight,
              border:`2px dashed ${C.leaf}` }}>
              <button onClick={loadDemoAccount}
                style={{ width:"100%", padding:"13px", borderRadius:12, background:C.leaf, color:C.white,
                  fontWeight:900, fontSize:14, border:"none", cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {t.obDemo}
              </button>
              <p style={{ fontSize:11, color:C.leafDark, lineHeight:1.5, marginTop:8, fontFamily:"Poppins,sans-serif" }}>
                {t.obDemoNote}
              </p>

            <button onClick={skipOnboarding}
              style={{ width:"100%", padding:"13px", borderRadius:14, marginTop:10, background:"none",
                color:C.fade, fontWeight:800, fontSize:13, border:"none", cursor:"pointer",
                textDecoration:"underline", fontFamily:"Poppins,sans-serif" }}>
              {t.obSkip}
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight:"100vh", background:C.skyPale, fontFamily:"Poppins,sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap');*{box-sizing:border-box;margin:0;padding:0}
.app-shell{max-width:440px;margin:0 auto;padding-bottom:88px;position:relative;min-height:100vh;}
@media (min-width:700px){ .app-shell{max-width:560px;} }
`}</style>

      <div className="app-shell">

        {/* NAV */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
          padding:"13px 20px", background:`linear-gradient(100deg,${C.sky},${C.skyDark})`,
          position:"sticky", top:0, zIndex:20 }}>
          <div style={{ fontWeight:900, fontSize:16, color:C.white }}>
            <span style={{ fontWeight:300, letterSpacing:"0.06em", opacity:0.88 }}>a&nbsp;little&nbsp;</span>
            <span style={{ fontWeight:900, fontSize:20, color:C.sun }}>V</span>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <button onClick={() => setLang(lang === "en" ? "ja" : "en")}
              style={{ fontSize:11, fontWeight:800, padding:"5px 12px", borderRadius:999,
                border:"2px solid rgba(255,255,255,0.65)", color:C.white,
                background:"rgba(255,255,255,0.18)", cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
              {lang === "en" ? "日本語" : "English"}
            </button>
            {/* アカウントのアイコン(タップでやり直し) */}
            <button onClick={signOut} title={t.signOut}
              style={{ width:34, height:34, borderRadius:"50%", border:"2px solid rgba(255,255,255,0.7)",
                background:"rgba(255,255,255,0.22)", cursor:"pointer", fontSize:18,
                display:"flex", alignItems:"center", justifyContent:"center" }}>
              {meAvatar}
            </button>
          </div>
        </div>

        {/* ===== プッシュ通知バナー(デモ) ===== */}
        {pushFor && (() => {
          const item = DATA.find(d => d.id === pushFor);
          if (!item) return null;
          return (
            <div style={{ position:"sticky", top:60, zIndex:35, margin:"10px 12px 0",
              background:C.white, borderRadius:16, border:`1.5px solid ${C.sky}`,
              boxShadow:"0 8px 28px rgba(11,190,235,0.28)", padding:"12px 14px", fontFamily:"Poppins,sans-serif" }}>
              <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
                <span style={{ width:26, height:26, borderRadius:7, background:`linear-gradient(140deg,${C.sky},${C.leaf})`,
                  display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, color:C.white, fontWeight:900 }}>V</span>
                <span style={{ fontSize:11, fontWeight:800, color:C.ink }}>{t.pushTitle}</span>
                <button onClick={() => setPushFor(null)}
                  style={{ marginLeft:"auto", fontSize:14, color:C.fade, background:"none", border:"none", cursor:"pointer", lineHeight:1 }}>✕</button>
              </div>
              <p style={{ fontSize:12.5, color:C.ink, lineHeight:1.5, marginBottom:10 }}>{t.pushBody(item.name)}</p>
              <button onClick={() => answerAttend(pushFor, "not")}
                style={{ width:"100%", padding:"9px", borderRadius:10, fontWeight:800, fontSize:12,
                  background:C.white, color:"#C0392B", border:"1.5px solid #E8A9A9", cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {t.notGoing}
              </button>
            </div>
          );
        })()}

        {/* ===== PUBLIC: 検索ページ or ボランティアページ ===== */}
        {tab === "public" && !openItem && (
          <div style={{ padding:"16px 16px 0" }}>
            {/* 検索バー */}
            <div style={{ display:"flex", gap:8, marginBottom:12 }}>
              <input value={query} onChange={e => setQuery(e.target.value)} placeholder={t.searchPlaceholder}
                style={{ flex:1, minHeight:44, padding:"10px 14px", borderRadius:14, border:`1.5px solid ${C.line}`,
                  fontSize:14, color:C.ink, background:C.white, fontFamily:"Poppins,sans-serif", outline:"none" }} />
              <button onClick={() => setShowFilters(!showFilters)}
                style={{ minHeight:44, padding:"0 14px", borderRadius:14, fontWeight:800, fontSize:12.5,
                  border:`2px solid ${showFilters || activeFilterCount ? C.sky : C.line}`,
                  background: showFilters || activeFilterCount ? C.sky : C.white,
                  color: showFilters || activeFilterCount ? C.white : C.ink,
                  cursor:"pointer", fontFamily:"Poppins,sans-serif", whiteSpace:"nowrap" }}>
                {t.filters}{activeFilterCount ? ` (${activeFilterCount})` : ""}
              </button>
            </div>

            {/* フィルタ */}
            {showFilters && (
              <div style={{ background:C.white, borderRadius:16, border:`1.5px solid ${C.line}`,
                padding:"14px 16px", marginBottom:12 }}>
                {[
                  { label:t.fArea, opts:t.areas, val:fArea, set:setFArea },
                  { label:t.fContent, opts:t.contents, val:fContent, set:setFContent },
                  { label:t.fEffort, opts:t.efforts, val:fEffort, set:setFEffort },
                ].map((row, i) => (
                  <div key={i} style={{ marginBottom:12 }}>
                    <div style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.1em", marginBottom:7 }}>{row.label}</div>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:7 }}>
                      {Object.entries(row.opts).map(([k, v]) =>
                        <Chip key={k} label={v} active={row.val.includes(k)} onClick={() => toggle(row.val, row.set, k)} />)}
                    </div>
                  </div>
                ))}
                <div style={{ marginBottom:4 }}>
                  <div style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.1em", marginBottom:7 }}>{t.fTime}</div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:7 }}>
                    {Object.entries(t.times).map(([k, v]) =>
                      <Chip key={k} label={v} active={fTime === k} onClick={() => setFTime(k)} />)}
                  </div>
                </div>
                {activeFilterCount > 0 && (
                  <button onClick={clearFilters}
                    style={{ marginTop:12, fontSize:12, fontWeight:800, color:C.fade, background:"none",
                      border:"none", cursor:"pointer", padding:0, fontFamily:"Poppins,sans-serif" }}>
                    {t.clear} ✕
                  </button>
                )}
              </div>
            )}

            <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:10, paddingLeft:2 }}>
              <span style={{ fontSize:11, fontWeight:800, color:C.fade, letterSpacing:"0.06em" }}>{t.resultsN(results.length)}</span>
              <span style={{ fontSize:10.5, fontWeight:700, color:C.sky }}>
                {t.fromOrgs(new Set(results.map(d => d.org).filter(Boolean)).size)}
              </span>
            </div>
            {friendPickCount > 0 && (
              <div style={{ background:"rgba(255,213,53,0.18)", border:`1.5px solid ${C.sun}`,
                borderRadius:12, padding:"8px 13px", marginBottom:12, fontSize:12, fontWeight:800,
                color:C.sunText, fontFamily:"Poppins,sans-serif" }}>
                {t.friendPick(friendPickCount)}
              </div>
            )}

            {results.length === 0 && (
              <div style={{ background:C.warn, border:`1.5px solid ${C.warnB}`, borderRadius:14,
                padding:"12px 14px", fontSize:12.5, color:C.warnT, lineHeight:1.5, fontFamily:"Poppins,sans-serif" }}>
                {t.noResults}
              </div>
            )}

            {sortedResults.map(item => (
              <ListCard key={item.id} item={item} t={t} lang={lang}
                onOpen={() => setOpenId(item.id)}
                bookmarked={!!bookmarks[item.id]} applied={!!applied[item.id]}
                friendsGoing={friendsIn(item.id)} />
            ))}
          </div>
        )}

        {/* ===== ボランティアページ(詳細) ===== */}
        {tab === "public" && openItem && (
          <div style={{ padding:"16px 16px 0" }}>
            <button onClick={() => setOpenId(null)}
              style={{ fontSize:12.5, fontWeight:700, color:C.fade, background:"none", border:"none",
                cursor:"pointer", padding:0, marginBottom:14, fontFamily:"Poppins,sans-serif" }}>
              {t.detailBack}
            </button>

            {/* ヘッダー */}
            <div style={{ borderRadius:20, overflow:"hidden", border:"1.5px solid #9ADBB6",
              boxShadow:"0 4px 20px rgba(0,168,79,0.12)", marginBottom:16 }}>
              <div style={{ background:`linear-gradient(110deg,${C.sky} 0%,#0DD8EE 60%,#00E5BE 100%)`,
                padding:"14px 18px", position:"relative", overflow:"hidden" }}>
                <div style={{ position:"absolute", inset:0,
                  backgroundImage:"radial-gradient(circle,rgba(255,255,255,0.22) 1.5px,transparent 1.5px)",
                  backgroundSize:"14px 14px" }} />
                <div style={{ position:"relative" }}>
                  <div style={{ fontWeight:900, fontSize:18, color:C.white, lineHeight:1.3, fontFamily:"Poppins,sans-serif" }}>
                    {openItem.name}
                  </div>
                  {openItem.org && <div style={{ fontSize:12, color:"rgba(255,255,255,0.9)", marginTop:5, fontWeight:600 }}>{openItem.org}</div>}
                </div>
              </div>
              <div style={{ background:C.leafLight, padding:"14px 18px" }}>
                <div style={{ display:"flex", gap:14, fontSize:12, color:C.fade, flexWrap:"wrap", fontFamily:"Poppins,sans-serif" }}>
                  <span>⏱ {openItem.dur}{t.hours}</span>
                  <span>📍 {t.areas[openItem.area]}</span>
                  <span style={{ fontWeight:800, color:C.leaf }}>💵 {t.free}</span>
                  {openItem.recurring && <span>🔁 {t.every[openItem.recurring]}</span>}
                </div>
              </div>
            </div>

            {/* 説明 */}
            <div style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.12em", marginBottom:7 }}>{t.aboutTitle}</div>
            <p style={{ fontSize:13.5, color:C.ink, lineHeight:1.7, marginBottom:16, fontFamily:"Poppins,sans-serif" }}>
              {lang === "ja" ? openItem.ja : openItem.en}
            </p>

            {/* 参加方法 */}
            <div style={{ background:C.white, borderRadius:14, border:`1.5px solid ${C.line}`, padding:"12px 15px", marginBottom:16 }}>
              <div style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.1em", marginBottom:4 }}>{t.joinTitle}</div>
              <div style={{ fontSize:13, fontWeight:700, color:C.ink, fontFamily:"Poppins,sans-serif" }}>{t.bookLabel[openItem.booking]}</div>
            </div>

            {/* ===== 参加者リスト(このアプリの核心) =====
                 並び順: 自分 → 友達(💛) → 一緒に参加した回数が多い人 → はじめての人
                 縦スクロールで限られた枠に収める                         */}
            {(() => {
              const apps = applicantsOf(openItem.id);
              const goingN = apps.filter(a => a.gps === "arrived" || a.gps === "onway").length;
              return (
                <div style={{ background:C.white, borderRadius:16, border:`1.5px solid ${C.line}`, marginBottom:16, overflow:"hidden" }}>
                  {/* ヘッダー */}
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                    padding:"12px 15px", borderBottom:apps.length?`1px solid ${C.line}`:"none" }}>
                    <div style={{ fontSize:12, fontWeight:800, color:C.sky }}>👥 {t.whoTitle}</div>
                    <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                      <span style={{ fontSize:10.5, fontWeight:700, color:C.fade }}>{t.whoCount(apps.length)}</span>
                      {goingN > 0 && <span style={{ fontSize:10.5, fontWeight:800, color:C.leaf }}>📍 {goingN}</span>}
                    </div>
                  </div>

                  {apps.length === 0 && (
                    <div style={{ padding:"14px 15px", fontSize:12, color:C.fade, lineHeight:1.5, fontFamily:"Poppins,sans-serif" }}>{t.whoNone}</div>
                  )}

                  {/* 縦スクロールする参加者リスト */}
                  {apps.length > 0 && (
                    <div style={{ maxHeight:290, overflowY:"auto", WebkitOverflowScrolling:"touch" }}>
                      {apps.map((a, idx) => (
                        <div key={a.id} style={{ display:"flex", alignItems:"center", gap:11,
                          padding:"10px 15px",
                          borderTop: idx === 0 ? "none" : `1px solid ${C.skyPale}`,
                          background: a.mine ? "rgba(255,213,53,0.10)" : (a.friend ? "rgba(255,213,53,0.05)" : "transparent"),
                          opacity: a.status === "not" ? 0.45 : 1 }}>

                          {/* アイコン */}
                          <div style={{ flexShrink:0, width:38, height:38, borderRadius:"50%",
                            background: a.mine ? C.sun : C.skyLight, display:"flex", alignItems:"center", justifyContent:"center",
                            fontSize:19, filter: a.status === "not" ? "grayscale(1)" : "none" }}>{a.emoji}</div>

                          {/* 名前 + 💛友達 + 一緒に参加した回数 */}
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                              <span style={{ fontSize:13.5, fontWeight:800, color:C.ink, fontFamily:"Poppins,sans-serif",
                                overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{a.name}</span>
                              {a.friend && <span style={{ fontSize:13 }} title={t.friendLabel}>💛</span>}

                            {!a.mine && a.coCount > 0 && (
                              <div style={{ fontSize:10.5, fontWeight:700, color:C.leaf, marginTop:2, fontFamily:"Poppins,sans-serif" }}>
                                🔁 {t.coTimes(a.coCount)}
                              </div>
                            )}
                          </div>

                          {/* 友達登録ボタン(まだ友達でない人だけ) */}
                          {!a.mine && !a.friend && (
                            <button onClick={() => addFriend(a.id)}
                              style={{ flexShrink:0, padding:"5px 10px", borderRadius:999, fontSize:10.5, fontWeight:800,
                                border:`1.5px solid ${C.sky}`, background:C.white, color:C.sky, cursor:"pointer",
                                fontFamily:"Poppins,sans-serif", whiteSpace:"nowrap" }}>
                              {t.addFriendBtn}
                            </button>
                          )}

                          {/* 右端: 当日の状況。GPSが取れていれば位置(到着/向かい中)、
                               なければ本人の回答(✓/✕)、未回答は空欄 */}
                          <div style={{ flexShrink:0, minWidth:26, textAlign:"right" }}>
                            {a.gps === "arrived" ? (
                              <span style={{ display:"inline-flex", alignItems:"center", gap:3,
                                background:C.leafLight, color:C.leafDark, padding:"3px 8px", borderRadius:999,
                                fontSize:10, fontWeight:900, fontFamily:"Poppins,sans-serif", whiteSpace:"nowrap" }}>
                                📍 {t.gpsArrived}
                              </span>
                            ) : a.gps === "onway" ? (
                              <span style={{ display:"inline-flex", alignItems:"center", gap:3,
                                background:C.skyLight, color:C.skyDark, padding:"3px 8px", borderRadius:999,
                                fontSize:10, fontWeight:900, fontFamily:"Poppins,sans-serif", whiteSpace:"nowrap" }}>
                                🚶 {t.gpsOnway}
                              </span>
                            ) : a.status === "not" ? (
                              <span style={{ fontSize:16, fontWeight:900, color:"#E06B6B" }}>✕</span>
                            ) : null}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* 凡例 */}
                  {apps.length > 0 && (
                    <div style={{ display:"flex", gap:12, flexWrap:"wrap", padding:"9px 15px",
                      borderTop:`1px solid ${C.line}`, background:C.skyPale }}>
                      <span style={{ fontSize:9.5, fontWeight:700, color:C.fade }}>💛 {t.legendFriend}</span>
                      <span style={{ fontSize:9.5, fontWeight:700, color:C.fade }}>🔁 {t.legendCo}</span>
                      <span style={{ fontSize:9.5, fontWeight:700, color:C.leafDark }}>📍 {t.gpsArrived}</span>
                      <span style={{ fontSize:9.5, fontWeight:700, color:C.skyDark }}>🚶 {t.gpsOnway}</span>
                      <span style={{ fontSize:9.5, fontWeight:700, color:"#E06B6B" }}>✕ {t.statusNot}</span>
                    </div>
                  )}
                  {/* GPSで自動更新されるという仕組みの説明 */}
                  {apps.length > 0 && (
                    <div style={{ padding:"9px 15px", borderTop:`1px solid ${C.line}`, background:C.white }}>
                      <p style={{ fontSize:10.5, color:C.fade, lineHeight:1.55, fontFamily:"Poppins,sans-serif" }}>
                        {t.gpsHow}
                      </p>
                    </div>
                  )}
                </div>
              );
            })()}

            {/* 開始2時間前の確認。今日ひらかれる活動のときだけ出る */}
            {applied[openItem.id] && itemDates[openItem.id] === iso(new Date()) && (
              <div style={{ background:C.skyPale, borderRadius:14, border:`2px solid ${C.sky}`, padding:"14px 16px", marginBottom:12 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:11 }}>
                  <span style={{ fontSize:11.5, fontWeight:900, color:C.sky }}>⏰ {t.dayOfTitle}</span>
                  <button onClick={() => setPushFor(openItem.id)}
                    style={{ fontSize:10.5, fontWeight:800, color:C.sky, background:C.white,
                      border:`1.5px dashed ${C.sky}`, borderRadius:9, padding:"5px 10px",
                      cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                    {t.demoTrigger}
                  </button>
                </div>
                <div>
                {myAttend[openItem.id] ? (
                  <>

                <div style={{ height:"52vh", minHeight:280, overflowY:"auto", WebkitOverflowScrolling:"touch",
                  marginBottom:12, background:C.white, borderRadius:14, border:`1.5px solid ${C.line}`, padding:"12px 13px" }}>
                  {(talks[openRoom] || []).length === 0 && (
                    <p style={{ fontSize:12, color:C.fade, fontFamily:"Poppins,sans-serif" }}>{t.talkEmpty}</p>
                  )}
                  {(talks[openRoom] || []).map((m, i) => (
                    <div key={i} style={{ display:"flex", gap:8, marginBottom:11,
                      flexDirection: m.mine ? "row-reverse" : "row" }}>
                      <span style={{ flexShrink:0, width:30, height:30, borderRadius:"50%",
                        background: m.mine ? C.sun : C.skyLight, display:"flex", alignItems:"center",
                        justifyContent:"center", fontSize:15 }}>{m.avatar}</span>
                      <div style={{ maxWidth:"72%" }}>
                        {!m.mine && (
                          <div style={{ fontSize:9.5, fontWeight:800, color:C.fade, marginBottom:3, fontFamily:"Poppins,sans-serif" }}>{m.who}</div>
                        )}
                        <div style={{ padding:"8px 12px", borderRadius:14, fontSize:13, lineHeight:1.5,
                          background: m.mine ? C.sky : C.skyPale,
                          color: m.mine ? C.white : C.ink, fontFamily:"Poppins,sans-serif" }}>
                          {m.text}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                {/* 入力欄 */}
                <div style={{ display:"flex", gap:8 }}>
                  <input value={talkDraft} onChange={e => setTalkDraft(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter") sendTalk(openRoom); }}
                    placeholder={t.talkPlaceholder}
                    style={{ flex:1, minHeight:46, padding:"11px 14px", borderRadius:14,
                      border:`1.5px solid ${C.line}`, fontSize:14, color:C.ink, background:C.white,
                      fontFamily:"Poppins,sans-serif", outline:"none" }} />
                  <button onClick={() => sendTalk(openRoom)}
                    style={{ flexShrink:0, padding:"0 18px", minHeight:46, borderRadius:14,
                      background:`linear-gradient(110deg,${C.sky},#00D8EE)`, color:C.white,
                      fontWeight:900, fontSize:13, border:"none", cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                    {t.talkSend}
                  </button>
                </div>
              </div>
              )}
            </div>
          );
        })()}

        <p style={{ textAlign:"center", fontSize:10, color:C.line, marginTop:24, marginBottom:8,
          padding:"0 20px", lineHeight:1.6, fontWeight:600 }}>{t.foot}</p>

        {/* ===== トースト ===== */}
        {toast && (
          <div style={{ position:"fixed", bottom:96, left:"50%", transform:"translateX(-50%)",
            background:C.ink, color:C.white, padding:"11px 20px", borderRadius:999, fontSize:12.5,
            fontWeight:700, zIndex:40, fontFamily:"Poppins,sans-serif", whiteSpace:"nowrap",
            boxShadow:"0 6px 20px rgba(0,0,0,0.25)" }}>
            {toast}
          </div>
        )}

        {/* ===== 自分の予定を追加するモーダル ===== */}
        {showAddOwn && (
          <div onClick={() => setShowAddOwn(false)}
            style={{ position:"fixed", inset:0, background:"rgba(14,40,48,0.45)", zIndex:50,
              display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>
            <div onClick={e => e.stopPropagation()}
              style={{ width:"100%", maxWidth:360, background:C.white, borderRadius:22,
                padding:"22px 20px", fontFamily:"Poppins,sans-serif" }}>
              <h3 style={{ fontWeight:900, fontSize:18, color:C.ink, marginBottom:16 }}>{t.addOwnTitle}</h3>
              <div style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.1em", marginBottom:6 }}>{t.addOwnDate}</div>
              <input type="date" value={ownDate} onChange={e => setOwnDate(e.target.value)}
                style={{ width:"100%", minHeight:44, padding:"8px 12px", borderRadius:12, border:`1.5px solid ${C.line}`,
                  fontSize:14, color:C.ink, background:C.white, fontFamily:"Poppins,sans-serif", outline:"none", marginBottom:14 }} />
              <input value={ownText} onChange={e => setOwnText(e.target.value)} placeholder={t.addOwnPlaceholder}
                style={{ width:"100%", minHeight:44, padding:"10px 12px", borderRadius:12, border:`1.5px solid ${C.line}`,
                  fontSize:14, color:C.ink, background:C.white, fontFamily:"Poppins,sans-serif", outline:"none", marginBottom:16 }} />
              <button onClick={addOwnPlan}
                style={{ width:"100%", padding:"14px", borderRadius:14, marginBottom:9,
                  background:`linear-gradient(110deg,${C.sky},#00D8EE)`, color:C.white,
                  fontWeight:900, fontSize:14, border:"none", cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {t.addOwnSave}
              </button>
              <button onClick={() => setShowAddOwn(false)}
                style={{ width:"100%", padding:"11px", borderRadius:14, background:"none",
                  color:C.fade, fontWeight:800, fontSize:13, border:`1.5px solid ${C.line}`,
                  cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {t.addOwnCancel}
              </button>
            </div>
          </div>
        )}

        {/* ===== 新しい部屋を作る ===== */}
        {showNewRoom && (
          <div onClick={() => setShowNewRoom(false)}
            style={{ position:"fixed", inset:0, background:"rgba(14,40,48,0.5)", zIndex:60,
              display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>
            <div onClick={e => e.stopPropagation()}
              style={{ width:"100%", maxWidth:380, maxHeight:"86vh", overflowY:"auto",
                background:C.white, borderRadius:24, padding:"24px 22px", fontFamily:"Poppins,sans-serif" }}>
              <h3 style={{ fontWeight:900, fontSize:20, color:C.ink, marginBottom:18 }}>👥 {t.newRoomTitle}</h3>

              {/* 部屋の名前 */}
              <div style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.1em", marginBottom:7 }}>{t.newRoomNameLabel}</div>
              <input value={newRoomName} onChange={e => setNewRoomName(e.target.value)}
                placeholder={t.newRoomNamePh}
                style={{ width:"100%", minHeight:46, padding:"11px 14px", borderRadius:14,
                  border:`1.5px solid ${C.line}`, fontSize:14, color:C.ink, background:C.white,
                  fontFamily:"Poppins,sans-serif", outline:"none", marginBottom:18 }} />

              {/* メンバー選択 */}
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginBottom:8 }}>
                <span style={{ fontSize:10, fontWeight:800, color:C.sky, letterSpacing:"0.1em" }}>{t.newRoomPick}</span>
                <span style={{ fontSize:10.5, fontWeight:700, color:C.fade }}>{t.pickedN(newRoomMembers.length)}</span>
              </div>
              {people.filter(pp => pp.friend).map(f => {
                const on = newRoomMembers.includes(f.id);
                return (
                  <button key={f.id}
                    onClick={() => setNewRoomMembers(on ? newRoomMembers.filter(x => x !== f.id) : [...newRoomMembers, f.id])}
                    style={{ width:"100%", display:"flex", alignItems:"center", gap:10, textAlign:"left",
                      background: on ? C.skyLight : C.white, border:`2px solid ${on ? C.sky : C.line}`,
                      borderRadius:12, padding:"9px 12px", marginBottom:8, cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                    <span style={{ width:32, height:32, borderRadius:"50%", background:C.skyPale,
                      display:"flex", alignItems:"center", justifyContent:"center", fontSize:17, flexShrink:0 }}>{f.emoji}</span>
                    <span style={{ flex:1, fontSize:13.5, fontWeight:800, color:C.ink }}>{f.name}</span>
                    {on && <span style={{ color:C.sky, fontWeight:900, fontSize:15 }}>✓</span>}
                  </button>
                );
              })}

              <button onClick={createRoom}
                disabled={!newRoomName.trim() || newRoomMembers.length === 0}
                style={{ width:"100%", padding:"15px", borderRadius:16, marginTop:10,
                  background: (!newRoomName.trim() || newRoomMembers.length === 0) ? C.line : `linear-gradient(110deg,${C.sky},#00D8EE)`,
                  color:C.white, fontWeight:900, fontSize:15, border:"none",
                  cursor: (!newRoomName.trim() || newRoomMembers.length === 0) ? "not-allowed" : "pointer",
                  fontFamily:"Poppins,sans-serif" }}>
                {t.newRoomCreate}
              </button>
              <button onClick={() => setShowNewRoom(false)}
                style={{ width:"100%", padding:"12px", borderRadius:14, marginTop:9, background:"none",
                  color:C.fade, fontWeight:800, fontSize:13, border:`1.5px solid ${C.line}`,
                  cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {t.newRoomCancel}
              </button>
            </div>
          </div>
        )}

        {/* ===== QRでアカウント交換 ===== */}
        {showQR && (
          <div onClick={() => setShowQR(false)}
            style={{ position:"fixed", inset:0, background:"rgba(14,40,48,0.5)", zIndex:60,
              display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>
            <div onClick={e => e.stopPropagation()}
              style={{ width:"100%", maxWidth:360, maxHeight:"88vh", overflowY:"auto",
                background:C.white, borderRadius:24, padding:"24px 22px", fontFamily:"Poppins,sans-serif" }}>
              <h3 style={{ fontWeight:900, fontSize:20, color:C.ink, textAlign:"center", marginBottom:4 }}>{t.qrTitle}</h3>
              <p style={{ fontSize:11.5, color:C.fade, textAlign:"center", marginBottom:16 }}>{t.qrMine}</p>

              {/* 自分のQRコード(見た目のみのダミー) */}
              <div style={{ display:"flex", justifyContent:"center", marginBottom:8 }}>
                <div style={{ padding:14, background:C.white, borderRadius:18, border:`2px solid ${C.line}` }}>
                  <svg width="150" height="150" viewBox="0 0 29 29" shapeRendering="crispEdges">
                    <rect width="29" height="29" fill="#FFFFFF"/>
                    {(() => {
                      // 名前から決まるパターンで「それらしい」QRを描く(飾り)
                      const seedStr = (meName || "V") + (meAvatar || "");
                      let seed = 0; for (let i=0;i<seedStr.length;i++) seed = (seed*31 + seedStr.charCodeAt(i)) % 99991;
                      const cells = [];
                      const rnd = (n) => { seed = (seed*1103515245 + 12345) % 2147483648; return seed % n; };
                      // 位置検出パターン(3隅)
                      const finder = (ox, oy) => {
                        const out = [];
                        for (let y=0;y<7;y++) for (let x=0;x<7;x++) {
                          const edge = x===0||x===6||y===0||y===6;
                          const core = x>=2&&x<=4&&y>=2&&y<=4;
                          if (edge||core) out.push(<rect key={`f${ox}-${oy}-${x}-${y}`} x={ox+x} y={oy+y} width="1" height="1" fill="#0E2830"/>);
                        }
                        return out;
                      };
                      cells.push(...finder(0,0), ...finder(22,0), ...finder(0,22));
                      for (let y=0;y<29;y++) for (let x=0;x<29;x++) {
                        const inFinder = (x<9&&y<9)||(x>20&&y<9)||(x<9&&y>20);
                        if (inFinder) continue;
                        if (rnd(100) < 45) cells.push(<rect key={`c${x}-${y}`} x={x} y={y} width="1" height="1" fill="#0E2830"/>);
                      }
                      return cells;
                    })()}
                  </svg>
                </div>
              </div>
              <div style={{ textAlign:"center", marginBottom:20 }}>
                <span style={{ fontSize:22 }}>{meAvatar}</span>
                <span style={{ fontSize:15, fontWeight:800, color:C.ink, marginLeft:6 }}>{meName}</span>
              </div>

              {/* 相手のコードを読み取る(デモ: 候補から選ぶ) */}
              <div style={{ borderTop:`1.5px solid ${C.line}`, paddingTop:16 }}>
                <div style={{ fontSize:11, fontWeight:800, color:C.sky, marginBottom:4 }}>{t.qrScan}</div>
                <p style={{ fontSize:11, color:C.fade, marginBottom:11 }}>{t.qrPick}</p>
                {people.filter(pp => !pp.friend).slice(0, 5).map(pp => {
                  const co = pp.history.filter(h => myHistory.includes(h)).length;
                  return (
                    <button key={pp.id} onClick={() => { addFriend(pp.id); setShowQR(false); }}
                      style={{ width:"100%", display:"flex", alignItems:"center", gap:10, textAlign:"left",
                        background:C.white, border:`1.5px solid ${C.line}`, borderRadius:12,
                        padding:"9px 12px", marginBottom:8, cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                      <span style={{ width:32, height:32, borderRadius:"50%", background:C.skyLight,
                        display:"flex", alignItems:"center", justifyContent:"center", fontSize:17, flexShrink:0 }}>{pp.emoji}</span>
                      <span style={{ flex:1, minWidth:0 }}>
                        <span style={{ display:"block", fontSize:13, fontWeight:800, color:C.ink }}>{pp.name}</span>
                        {co > 0 && <span style={{ display:"block", fontSize:10, fontWeight:700, color:C.leaf, marginTop:1 }}>🔁 {t.metAt(co)}</span>}
                      </span>
                      <span style={{ flexShrink:0, fontSize:11, fontWeight:800, color:C.sky }}>{t.addFriendBtn}</span>
                    </button>
                  );
                })}
              </div>

              <button onClick={() => setShowQR(false)}
                style={{ width:"100%", padding:"12px", borderRadius:14, marginTop:8, background:"none",
                  color:C.fade, fontWeight:800, fontSize:13, border:`1.5px solid ${C.line}`,
                  cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {t.qrClose}
              </button>
            </div>
          </div>
        )}

        {/* ===== ブックマーク選択シート ===== */}
        {bmSheetFor && (
          <div onClick={() => setBmSheetFor(null)}
            style={{ position:"fixed", inset:0, background:"rgba(14,40,48,0.45)", zIndex:50,
              display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
            <div onClick={e => e.stopPropagation()}
              style={{ width:"100%", maxWidth:440, background:C.white, borderRadius:"24px 24px 0 0",
                padding:"22px 20px 28px", fontFamily:"Poppins,sans-serif" }}>
              <div style={{ width:40, height:4, borderRadius:999, background:C.line, margin:"0 auto 18px" }} />
              <h3 style={{ fontWeight:900, fontSize:19, color:C.ink, marginBottom:6 }}>{t.bmSheetT}</h3>
              <p style={{ fontSize:12, color:C.fade, lineHeight:1.6, marginBottom:16 }}>{t.bmSheetD}</p>

              {/* 自分のみ */}
              <button onClick={toggleBmMe}
                style={{ width:"100%", textAlign:"left", padding:"14px 16px", borderRadius:14, marginBottom:10,
                  border:`2px solid ${bmDraft.includes("me") ? C.leaf : C.line}`,
                  background: bmDraft.includes("me") ? C.leafLight : C.white,
                  cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span style={{ fontWeight:800, fontSize:14, color:C.ink }}>👤 {t.bmMe}</span>
                {bmDraft.includes("me") && <span style={{ color:C.leaf, fontWeight:900 }}>✓</span>}
              </button>

              {/* グループ(自分のみ選択中は薄く無効化) */}
              <div style={{ opacity: bmDraft.includes("me") ? 0.4 : 1, pointerEvents: bmDraft.includes("me") ? "none" : "auto" }}>
                {rooms.map(g => {
                  const on = bmDraft.includes(g.id);
                  return (
                    <button key={g.id} onClick={() => toggleBmGroup(g.id)}
                      style={{ width:"100%", textAlign:"left", padding:"14px 16px", borderRadius:14, marginBottom:10,
                        border:`2px solid ${on ? C.sky : C.line}`,
                        background: on ? C.skyLight : C.white,
                        cursor:"pointer", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <span style={{ fontWeight:800, fontSize:14, color:C.ink }}>👥 {roomName(g)}</span>
                      {on && <span style={{ color:C.sky, fontWeight:900 }}>✓</span>}
                    </button>
                  );
                })}
              </div>

              <button onClick={saveBm}
                style={{ width:"100%", padding:"15px", borderRadius:16, marginTop:8,
                  background:`linear-gradient(110deg,${C.sky},#00D8EE)`, color:C.white,
                  fontWeight:900, fontSize:15, border:"none", cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {bmDraft.length === 0 ? t.bmRemove : t.bmSave}
              </button>
            </div>
          </div>
        )}

        {/* ===== 申請確認ウィンドウ ===== */}
        {applyConfirmFor && (
          <div style={{ position:"fixed", inset:0, background:"rgba(14,40,48,0.45)", zIndex:50,
            display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>
            <div style={{ width:"100%", maxWidth:360, background:C.white, borderRadius:22,
              padding:"24px 22px", fontFamily:"Poppins,sans-serif", textAlign:"center" }}>
              <div style={{ fontSize:40, marginBottom:12 }}>📝</div>
              <h3 style={{ fontWeight:900, fontSize:19, color:C.ink, marginBottom:8 }}>{t.applyConfirmT}</h3>
              <p style={{ fontSize:12.5, color:C.fade, lineHeight:1.6, marginBottom:20 }}>{t.applyConfirmD}</p>
              <button onClick={() => {
                  setApplied({ ...applied, [applyConfirmFor]:true });
                  if (!itemDates[applyConfirmFor]) {
                    const item = DATA.find(d => d.id === applyConfirmFor);
                    setItemDates({ ...itemDates, [applyConfirmFor]: nextDateFor(item.recurring) });
                  }
                  setApplyConfirmFor(null); flash(t.applied);
                }}
                style={{ width:"100%", padding:"14px", borderRadius:14, marginBottom:10,
                  background:C.leaf, color:C.white, fontWeight:900, fontSize:14, border:"none",
                  cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {t.applyDone}
              </button>
              <button onClick={() => setApplyConfirmFor(null)}
                style={{ width:"100%", padding:"12px", borderRadius:14, background:"none",
                  color:C.fade, fontWeight:800, fontSize:13, border:`1.5px solid ${C.line}`,
                  cursor:"pointer", fontFamily:"Poppins,sans-serif" }}>
                {t.applyCancel}
              </button>
            </div>
          </div>
        )}

        {/* ===== 下部タブバー ===== */}
        <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
          width:"100%", maxWidth:440, background:C.white, borderTop:`1.5px solid ${C.line}`,
          display:"flex", zIndex:30 }}>
          {[
            { id:"public", icon:"🔍", label:t.tabPublic },
            { id:"personal", icon:"📅", label:t.tabPersonal },
            { id:"friends", icon:"👥", label:t.tabFriends },
          ].map(tb => (
            <button key={tb.id} onClick={() => { setTab(tb.id); setOpenId(null); setOpenRoom(null); }}
              style={{ flex:1, padding:"10px 0 12px", background:"none", border:"none", cursor:"pointer",
                display:"flex", flexDirection:"column", alignItems:"center", gap:3, fontFamily:"Poppins,sans-serif" }}>
              <span style={{ fontSize:20, filter: tab === tb.id ? "none" : "grayscale(1) opacity(0.5)" }}>{tb.icon}</span>
              <span style={{ fontSize:10, fontWeight:800, color: tab === tb.id ? C.sky : C.fade }}>{tb.label}</span>
            </button>
          ))}
        </div>

      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
